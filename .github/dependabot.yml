# Actions only. Cargo updates stay manual because cargo-sources.json must be
# regenerated for Flatpak whenever Cargo.lock changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-monthly:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
